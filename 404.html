<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página não encontrada — BTC Ancap News</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .error-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 70vh;
      text-align: center;
      padding: 40px 20px;
    }
    .error-page__code {
      font-size: 6rem;
      font-weight: 800;
      color: var(--color-accent);
      line-height: 1;
      margin-bottom: 8px;
    }
    .error-page__title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--color-heading);
      margin-bottom: 12px;
    }
    .error-page__text {
      color: var(--color-text-muted);
      font-size: 1rem;
      margin-bottom: 28px;
    }
    .error-page__btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      background: var(--color-accent);
      color: #000;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all var(--transition);
    }
    .error-page__btn:hover {
      background: var(--color-accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(247, 147, 26, 0.3);
    }
  </style>
</head>
<body>
  <div class="error-page">
    <div class="error-page__code">404</div>
    <h1 class="error-page__title">Página não encontrada</h1>
    <p class="error-page__text">A página que você procura não existe ou foi removida.</p>
    <a href="index.html" class="error-page__btn">
      <i class="fas fa-home"></i> Voltar para o início
    </a>
  </div>
</body>
</html>
