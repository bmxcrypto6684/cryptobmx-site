<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BTC ANCP News</title>

<style>
body{
margin:0;
font-family:Poppins,sans-serif;
background:#0b0f1a;
color:#fff;
}

header{
padding:15px;
background:#020617;
display:flex;
justify-content:space-between;
align-items:center;
}

nav a{
color:#fff;
margin:0 10px;
text-decoration:none;
}

.container{
max-width:1100px;
margin:auto;
padding:15px;
}

.hero{
padding:20px;
}

#btc-price{
color:#22c55e;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
}

.card{
background:#111827;
padding:10px;
border-radius:10px;
cursor:pointer;
transition:0.3s;
}

.card:hover{
transform:scale(1.03);
}

.card img{
width:100%;
height:150px;
object-fit:cover;
border-radius:10px;
}

.article{
display:none;
padding:20px;
background:#111827;
border-radius:10px;
}

button{
background:#22c55e;
border:none;
padding:10px;
color:#fff;
border-radius:8px;
cursor:pointer;
margin-top:10px;
}
</style>

</head>

<body>

<header>
<div><b>BTC ANCP News</b></div>
<nav>
<a href="#">Home</a>
<a href="#news">Notícias</a>
</nav>
</header>

<div class="container hero">
<h1>Bitcoin e Criptomoedas</h1>
<h2 id="btc-price">Carregando BTC...</h2>
</div>

<!-- NOTÍCIAS -->
<div class="container" id="news">

<h2>📰 Notícias</h2>

<div class="grid">

<div class="card" onclick="openArticle(0)">
<img src="https://images.unsplash.com/photo-1621761191319-c6fb62004040">
<h3>Bitcoin em alta</h3>
<p>Clique para ler mais</p>
</div>

<div class="card" onclick="openArticle(1)">
<img src="https://images.unsplash.com/photo-1640340434855-6084b1f4901c">
<h3>Adoção institucional</h3>
<p>Clique para ler mais</p>
</div>

<div class="card" onclick="openArticle(2)">
<img src="https://images.unsplash.com/photo-1621504450181-5d356f61d307">
<h3>Mercado cripto</h3>
<p>Clique para ler mais</p>
</div>

</div>
</div>

<!-- ARTIGO -->
<div class="container article" id="article">

<button onclick="closeArticle()">⬅ Voltar</button>

<h2 id="title"></h2>
<img id="img" style="width:100%;border-radius:10px;margin-top:10px;">
<p id="text"></p>

</div>

<!-- SIMULADOR -->
<div class="container">
<h2>📈 Simulador BTC</h2>

<input id="valor" type="number" placeholder="Valor em R$">
<button onclick="simular()">Simular</button>

<p id="resultado"></p>
</div>

<script>

// BTC preço
async function btc(){
try{
let res = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd");
let data = await res.json();
document.getElementById("btc-price").innerText = "BTC: $" + data.bitcoin.usd;
}catch(e){
document.getElementById("btc-price").innerText = "Erro BTC";
}
}
btc();

// simulador
function simular(){
let v = document.getElementById("valor").value;
if(!v){alert("Digite valor");return;}

fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd")
.then(r=>r.json())
.then(d=>{
let btc = v / d.bitcoin.usd;
document.getElementById("resultado").innerText = btc.toFixed(6)+" BTC";
});
}

// notícias
const news = [
{
title:"Bitcoin em alta",
img:"https://images.unsplash.com/photo-1621761191319-c6fb62004040",
text:"Bitcoin continua em alta com forte interesse institucional e aumento da demanda global."
},
{
title:"Adoção institucional cresce",
img:"https://images.unsplash.com/photo-1640340434855-6084b1f4901c",
text:"Grandes empresas estão comprando Bitcoin e reduzindo a oferta circulante no mercado."
},
{
title:"Mercado cripto se recupera",
img:"https://images.unsplash.com/photo-1621504450181-5d356f61d307",
text:"O mercado cripto mostra sinais de recuperação após períodos de queda."
}
];

function openArticle(i){
document.getElementById("news").style.display="none";
document.getElementById("article").style.display="block";

document.getElementById("title").innerText = news[i].title;
document.getElementById("img").src = news[i].img;
document.getElementById("text").innerText = news[i].text;
}

function closeArticle(){
document.getElementById("news").style.display="block";
document.getElementById("article").style.display="none";
}

</script>

</body>
</html>
